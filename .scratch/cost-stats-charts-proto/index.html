<!DOCTYPE html>
<!-- ============================================================
  原型（一次性探索用，非产品代码）：费用统计页三张图表的三套方案对比。
  问题：走势卡 / 加油卡 / 项目占比卡应该长什么样？
  方案：?variant=A（标准图表） B（日历热力） C（大数字极简）
  打开方式：浏览器直接打开本文件，或带 ?variant=B 刷新；←/→ 键切换。
  数据全部为造数（金额量级参考真实用车），与 Lunio 无任何代码关联。
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>费用统计图表 · 方案对比原型</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface2: #f1f5f9; --surface3: #e2e8f0;
    --ink: #111827; --muted: #64748b; --subtle: #94a3b8; --line: #e2e8f0;
    --primary: #2563eb; --primary-strong: #1d4ed8; --primary-soft: #dbeafe;
    --success: #22c55e; --success-soft: #dcfce7; --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #d9dee6; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink); padding: 24px 0 120px;
  }
  .banner {
    width: 390px; margin: 0 auto 12px; font-size: 11px; color: #7c2d12;
    background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 6px 10px;
  }
  .phone {
    width: 390px; margin: 0 auto; background: var(--bg); border-radius: 24px;
    padding: 16px 16px 24px; box-shadow: 0 12px 40px rgba(15, 23, 42, .18);
  }
  .topbar { display: flex; align-items: baseline; gap: 8px; padding: 4px 4px 12px; }
  .topbar .t { font-size: 20px; font-weight: 800; }
  .topbar .s { font-size: 11px; color: var(--muted); }
  .card { background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .sec-title { font-size: 15px; font-weight: 800; }
  .note { font-size: 11px; color: var(--muted); margin: 2px 0 10px; }
  .row { display: flex; align-items: baseline; }
  .grow { flex: 1; }
  .label-s { font-size: 10px; color: var(--muted); }
  .money-l { font-size: 20px; font-weight: 800; }
  .divider { width: 1px; align-self: stretch; background: var(--line); margin: 0 12px; }
  .green { color: var(--success); font-weight: 700; }
  .red { color: var(--danger); font-weight: 700; }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .chip-up { background: #fee2e2; color: var(--danger); }
  .chip-down { background: var(--success-soft); color: #15803d; }
  .scroll { overflow-x: auto; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ── 方案 A ── */
  .a-plot { position: relative; }
  .a-grid { position: absolute; left: 34px; right: 0; border-top: 1px dashed var(--line); }
  .a-tick { position: absolute; left: 0; width: 28px; text-align: right; font-size: 9px; color: var(--subtle); transform: translateY(-50%); }
  .a-cols { position: relative; margin-left: 34px; display: flex; align-items: flex-end; }
  .a-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .a-bar { border-radius: 6px 6px 2px 2px; }
  .a-amt { font-size: 9px; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
  .a-x { display: flex; margin-left: 34px; }
  .a-x span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }
  .a-x span.cur { color: var(--primary); font-weight: 800; }

  /* ── 方案 B ── */
  .b-matrix { display: grid; grid-template-columns: 26px repeat(12, 1fr); gap: 3px; align-items: center; }
  .b-cell { aspect-ratio: 1; border-radius: 4px; }
  .b-yl { font-size: 9px; color: var(--muted); }
  .b-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 8px; font-size: 9px; color: var(--subtle); }
  .b-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .b-month { width: 104px; flex: none; margin-right: 8px; }
  .b-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .b-day { aspect-ratio: 1; border-radius: 3px; background: var(--surface2); }
  .b-mtitle { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-bottom: 4px; }
  .b-mtitle b { color: var(--ink); }
  .b-tree { position: relative; height: 168px; border-radius: 10px; overflow: hidden; }
  .b-leaf { position: absolute; padding: 6px 7px; overflow: hidden; }
  .b-leaf .n { font-size: 10px; font-weight: 700; white-space: nowrap; }
  .b-leaf .v { font-size: 12px; font-weight: 800; }

  /* ── 方案 C ── */
  .c-big { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .c-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .c-insight { font-size: 11px; color: var(--muted); background: var(--surface2); border-radius: 8px; padding: 6px 9px; margin-top: 8px; }
  .c-stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 10px 0 8px; }
  .c-rows { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .c-row { display: flex; align-items: center; font-size: 12px; gap: 6px; }
  .c-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .c-row .amt { font-weight: 700; margin-left: auto; }
  .c-row .pct { color: var(--subtle); font-size: 10px; width: 38px; text-align: right; }
  .c-row .save { font-size: 10px; }

  /* ── 悬浮切换条 ── */
  .switcher {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 10px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 9;
  }
  .switcher button {
    background: rgba(255,255,255,.14); color: #fff; border: 0; width: 30px; height: 30px;
    border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .switcher .name { font-size: 13px; font-weight: 700; min-width: 168px; text-align: center; }
  .hint { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 10px; color: #475569; }
</style>
</head>
<body>
  <div class="banner">原型 · 三方案对比（造数演示，非产品代码） · 生效今天 = 2026-09-24</div>
  <div class="phone">
    <div class="topbar"><span class="t">费用统计</span><span class="s">当前车辆：本田 思域（燃油版）</span></div>

    <!-- 固定上下文：汇总卡 + 指标行（不在本原型改动范围内） -->
    <div class="card row">
      <div class="grow"><div class="label-s">总费用</div><div class="money-l">¥4,570.00</div></div>
      <div class="divider"></div>
      <div class="grow"><div class="label-s">今年保养</div><div class="money-l" style="color:var(--primary)">¥1,198.00</div></div>
      <div class="divider"></div>
      <div class="grow"><div class="label-s">今年加油</div><div class="money-l" id="sum-fuel">—</div></div>
    </div>
    <div class="card row" style="align-items:flex-start">
      <div class="grow"><div class="label-s">保养次数</div><b>11 次</b><div class="label-s">今年 4 次</div></div>
      <div class="grow"><div class="label-s">单次均价</div><b>¥415.45</b></div>
      <div class="grow"><div class="label-s">月均</div><b>¥106.28</b></div>
      <div class="grow"><div class="label-s">上次保养</div><b>10 天前</b></div>
    </div>

    <div id="charts"></div>
  </div>

  <div class="switcher">
    <button id="prev">←</button>
    <span class="name" id="vname"></span>
    <button id="next">→</button>
  </div>
  <div class="hint">← / → 键切换方案，或点箭头；URL ?variant= 可分享</div>

<script>
/* ================= 造数（确定性，每次刷新一致） ================= */
const money = c => '¥' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const yuan = c => '¥' + Math.round(c / 100).toLocaleString('en-US');

// 保养：逐年合计（分），与占比卡守恒（合计 457000 = ¥4,570）。
const yearTotals = [
  { year: 2023, cents: 92000 },
  { year: 2024, cents: 158000 },
  { year: 2025, cents: 87200 },
  { year: 2026, cents: 119800 },
];
// 保养：年×月矩阵（方案 B 用），稀疏——只有保养过的月份有钱。
const maintainByMonth = {
  2023: { 3: 38000, 9: 54000 },
  2024: { 3: 52000, 6: 31800, 11: 74200 },
  2025: { 4: 45200, 10: 42000 },
  2026: { 1: 15800, 4: 48600, 6: 33600, 9: 21800 },
};
// 项目占比（实付/省额，分），Σ实付 = 457000。
const shareItems = [
  { name: '轮胎', actual: 186000, save: 4000 },
  { name: '机油', actual: 124000, save: 8600 },
  { name: '刹车片', actual: 58000, save: 4000 },
  { name: '机油滤芯', actual: 42000, save: 2800 },
  { name: '空调滤芯', actual: 16000, save: 0 },
  { name: '其他', actual: 31000, save: 0, other: true },
];
const totalShare = shareItems.reduce((s, i) => s + i.actual, 0);
const totalSave = shareItems.reduce((s, i) => s + i.save, 0);

// 加油：按"笔"造数（2025-04 → 2026-09，共 18 个月），月合计 = 笔合计。
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20260924);
const fuelMonths = [];
{
  let idx = 0;
  for (let [y, m] of [[2025,4],[2025,5],[2025,6],[2025,7],[2025,8],[2025,9],[2025,10],[2025,11],[2025,12],[2026,1],[2026,2],[2026,3],[2026,4],[2026,5],[2026,6],[2026,7],[2026,8],[2026,9]]) {
    const fills = [];
    const n = 2 + (rnd() < 0.35 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      fills.push({ day: 1 + Math.floor(rnd() * 27), cents: 30000 + Math.floor(rnd() * 16000) + idx * 1000 });
    }
    fills.sort((a, b) => a.day - b.day);
    fuelMonths.push({ year: y, month: m, fills });
    idx++;
  }
}
const fuelTotal = fuelMonths.flatMap(m => m.fills).reduce((s, f) => s + f.cents, 0);
const fuelThisYear = fuelMonths.filter(m => m.year === 2026).flatMap(m => m.fills).reduce((s, f) => s + f.cents, 0);
const fuelCount = fuelMonths.flatMap(m => m.fills).length;
const fuelMonthCents = fuelMonths.map(m => m.fills.reduce((s, f) => s + f.cents, 0));
const fuelMax = Math.max(...fuelMonthCents);
const yearMax = Math.max(...yearTotals.map(y => y.cents));
document.getElementById('sum-fuel').textContent = money(fuelThisYear);

/* ================= 方案 A：标准图表（坐标系 + 环形图） ================= */
function variantA() {
  // —— 走势：年度柱 + 纵轴刻度 + 横向网格线 ——
  const tickMax = Math.ceil(yearMax / 50000) * 50000;
  const H = 120;
  const gridAndTicks = (max, top) => [0, max / 2, max].map(v => `
    <div class="a-grid" style="top:${top - (v / max) * (top - 14)}px"></div>
    <div class="a-tick" style="top:${top - (v / max) * (top - 14)}px">${v ? yuan(v) : '¥0'}</div>`).join('');
  const trendBars = yearTotals.map(y => `
    <div class="a-col">
      <div class="a-amt">${yuan(y.cents)}</div>
      <div class="a-bar" style="width:34px;height:${Math.max(6, (y.cents / tickMax) * (H - 26))}px;background:${y.year === 2026 ? 'var(--primary)' : 'var(--primary-soft)'}"></div>
    </div>`).join('');
  const trendX = yearTotals.map(y => `<span class="${y.year === 2026 ? 'cur' : ''}">${y.year}</span>`).join('');

  // —— 加油：同款坐标系，全历史月度横向滚动 ——
  const fMax = Math.ceil(fuelMax / 50000) * 50000;
  const colW = 38, axisW = 34;
  const W = fuelMonths.length * colW + 8;
  const fh = 120;
  let fuelCols = '';
  fuelMonths.forEach((m, i) => {
    const v = fuelMonthCents[i];
    const h = Math.max(6, (v / fMax) * (fh - 26));
    const cur = m.year === 2026 && m.month === 9;
    fuelCols += `
      <div style="width:${colW}px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end">
        <div class="a-amt">${yuan(v)}</div>
        <div class="a-bar" style="width:22px;height:${h}px;background:${cur ? 'var(--primary)' : 'var(--primary-soft)'}"></div>
        <div style="font-size:8px;color:${cur ? 'var(--primary)' : 'var(--muted)'};font-weight:${cur ? 800 : 500};margin-top:4px">${m.year % 100}.${m.month}</div>
      </div>`;
  });
  const fuelTicks = [0, fMax / 2, fMax].map(v => `
    <div class="a-grid" style="top:${fh - 18 - (v / fMax) * (fh - 44)}px"></div>
    <div class="a-tick" style="top:${fh - 18 - (v / fMax) * (fh - 44)}px">${v ? yuan(v) : '¥0'}</div>`).join('');

  // —— 占比：环形图 + 图例 ——
  const C = 2 * Math.PI * 52;
  let off = 0;
  const palette = ['#1d4ed8', '#2563eb', '#60a5fa', '#93c5fd', '#bfdbfe', '#cbd5e1'];
  const arcs = shareItems.map((it, i) => {
    const frac = it.actual / totalShare;
    const seg = `<circle r="52" cx="70" cy="70" fill="none" stroke="${it.other ? '#cbd5e1' : palette[i]}" stroke-width="24"
      stroke-dasharray="${(frac * C - 1.5).toFixed(1)} ${(C - frac * C + 1.5).toFixed(1)}" stroke-dashoffset="${(-off * C).toFixed(1)}" transform="rotate(-90 70 70)"/>`;
    off += frac;
    return seg;
  }).join('');
  const legend = shareItems.map((it, i) => `
    <div class="row" style="padding:5px 0;border-bottom:1px solid var(--line)">
      <i style="width:9px;height:9px;border-radius:3px;background:${it.other ? '#cbd5e1' : palette[i]};margin-right:7px;flex:none"></i>
      <span style="font-size:12px">${it.name}</span>
      <span class="grow"></span>
      ${it.save ? `<span class="green" style="font-size:10px;margin-right:7px">省 ${yuan(it.save)}</span>` : ''}
      <b style="font-size:12px">${yuan(it.actual)}</b>
    </div>`).join('');

  // 初始停最右（与 App 现行为一致）：渲染后把加油横向容器滚到尽头。
  requestAnimationFrame(() => {
    const el = document.getElementById('a-fuel-scroll');
    if (el) el.scrollLeft = el.scrollWidth;
  });
  return `
  <div class="card"><div class="sec-title">保养费用走势</div>
    <div class="note">每年一柱 · 纵轴标金额 · 今年高亮</div>
    <div class="a-plot" style="height:${H}px">${gridAndTicks(tickMax, H - 2)}
      <div class="a-cols" style="height:${H - 2}px">${trendBars}</div>
    </div>
    <div class="a-x" style="margin-top:6px">${trendX}</div>
  </div>
  <div class="card"><div class="sec-title">加油费用</div>
    <div class="note">总费用 ${yuan(fuelTotal)} · ${fuelCount} 笔 · 月度柱 + 纵轴刻度（可横向滚动，初始停最右）</div>
    <div class="scroll" id="a-fuel-scroll"><div class="a-plot" style="width:${W + axisW}px;height:${fh}px">${fuelTicks}
      <div class="a-cols" style="margin-left:${axisW}px;height:${fh - 18}px">${fuelCols}</div>
    </div></div>
  </div>
  <div class="card"><div class="sec-title">项目占比</div>
    <div class="note">环形图：中心 = 总费用，色块面积 = 实付占比</div>
    <div class="row" style="gap:14px;align-items:center">
      <svg width="140" height="140" style="flex:none">${arcs}
        <text x="70" y="66" text-anchor="middle" font-size="9" fill="#64748b">总费用</text>
        <text x="70" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">${yuan(totalShare)}</text>
      </svg>
      <div class="grow"><div class="label-s" style="margin-bottom:2px">累计优惠 <span class="green">${yuan(totalSave)}</span></div>${legend}</div>
    </div>
  </div>`;
}

/* ================= 方案 B：日历热力（热力矩阵 + 迷你日历 + 矩形树图） ================= */
function shade(frac) { // 0→浅，1→深，5 档主色阶
  const steps = ['#eff6ff', '#dbeafe', '#93c5fd', '#3b82f6', '#1d4ed8'];
  return steps[Math.min(4, Math.floor(frac * 4.999))];
}
function variantB() {
  // —— 走势：年 × 月热力矩阵 ——
  const mMax = Math.max(...Object.values(maintainByMonth).flatMap(o => Object.values(o)));
  let matrix = '';
  for (const y of [2023, 2024, 2025, 2026]) {
    matrix += `<div class="b-yl">${y}</div>`;
    for (let m = 1; m <= 12; m++) {
      const v = (maintainByMonth[y] || {})[m] || 0;
      matrix += `<div class="b-cell" style="background:${v ? shade(v / mMax) : 'var(--surface2)'}" title="${y}-${m} ${v ? yuan(v) : '无保养'}"></div>`;
    }
  }
  const monthHead = '<div></div>' + Array.from({ length: 12 }, (_, i) => `<div class="b-yl" style="text-align:center">${i + 1}</div>`).join('');

  // —— 加油：逐月迷你日历（每格一天，深浅 = 当天加油金额），横向滚动 ——
  const dayMax = Math.max(...fuelMonths.flatMap(m => m.fills.map(f => f.cents)));
  const cals = fuelMonths.map(m => {
    const offset = (new Date(m.year, m.month - 1, 1).getDay() + 6) % 7; // 周一为首列
    let cells = '';
    for (let i = 0; i < offset; i++) cells += '<div></div>';
    for (let d = 1; d <= 27 + 4; d++) {
      const fill = m.fills.find(f => f.day === d);
      cells += `<div class="b-day" style="${fill ? `background:${shade(fill.cents / dayMax)}` : ''}" title="${m.year}-${m.month}-${d}${fill ? ' ' + yuan(fill.cents) : ''}"></div>`;
      if (d === new Date(m.year, m.month, 0).getDate()) break;
    }
    const total = m.fills.reduce((s, f) => s + f.cents, 0);
    return `<div class="b-month">
      <div class="b-mtitle"><span>${m.year % 100}.${m.month}</span><b>${yuan(total)}</b></div>
      <div class="b-cal">${cells}</div>
    </div>`;
  }).join('');

  // —— 占比：矩形树图（面积 = 实付占比，二叉切分） ——
  const treePalette = { '轮胎': '#1d4ed8', '机油': '#2563eb', '刹车片': '#60a5fa', '机油滤芯': '#93c5fd', '空调滤芯': '#bfdbfe', '其他': '#cbd5e1' };
  const treeTextDark = { '机油滤芯': 1, '空调滤芯': 1, '其他': 1 };
  const leaves = [];
  (function split(node, items) {
    if (!items.length) return;
    if (items.length === 1) { leaves.push({ ...items[0], ...node }); return; }
    const total = items.reduce((s, i) => s + i.actual, 0);
    let acc = 0, i = 0;
    while (i < items.length - 1 && acc + items[i].actual < total / 2) { acc += items[i].actual; i++; }
    const head = items.slice(0, i + 1), tail = items.slice(i + 1);
    const f = head.reduce((s, it) => s + it.actual, 0) / total;
    if (node.w >= node.h) {
      split({ ...node, w: node.w * f }, head);
      split({ x: node.x + node.w * f, y: node.y, w: node.w * (1 - f), h: node.h }, tail);
    } else {
      split({ ...node, h: node.h * f }, head);
      split({ x: node.x, y: node.y + node.h * f, w: node.w, h: node.h * (1 - f) }, tail);
    }
  })({ x: 0, y: 0, w: 100, h: 100 }, [...shareItems].sort((a, b) => b.actual - a.actual));
  const tree = leaves.map(l => `
    <div class="b-leaf" style="left:${l.x}%;top:${l.y}%;width:${l.w}%;height:${l.h}%;background:${treePalette[l.name]};color:${treeTextDark[l.name] ? '#111827' : '#fff'}">
      <div class="n">${l.name}${l.save ? ` <span style="opacity:.85;font-weight:500">省${yuan(l.save)}</span>` : ''}</div>
      <div class="v">${yuan(l.actual)}</div>
    </div>`).join('');

  return `
  <div class="card"><div class="sec-title">保养费用走势</div>
    <div class="note">年 × 月热力矩阵：颜色越深 = 当月保养花钱越多（点格子看金额）</div>
    <div class="b-matrix">${matrix}${monthHead}</div>
    <div class="b-legend">¥0 <i style="background:#eff6ff"></i><i style="background:#dbeafe"></i><i style="background:#93c5fd"></i><i style="background:#3b82f6"></i><i style="background:#1d4ed8"></i> ${yuan(mMax)}</div>
  </div>
  <div class="card"><div class="sec-title">加油费用</div>
    <div class="note">总费用 ${yuan(fuelTotal)} · ${fuelCount} 笔 · 每格 = 一天，深浅 = 当天加油金额（横向滚动看历史）</div>
    <div class="scroll"><div style="display:flex">${cals}</div></div>
  </div>
  <div class="card"><div class="sec-title">项目占比</div>
    <div class="note">矩形树图：面积 = 实付占比，一屏看全部项目（累计优惠 <span class="green">${yuan(totalSave)}</span>）</div>
    <div class="b-tree">${tree}</div>
  </div>`;
}

/* ================= 方案 C：大数字极简（洞察 + 迷你走势线 + 堆叠条） ================= */
function sparkline(vals, w, h, cur) {
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - 4 - ((v - min) / span) * (h - 10)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg width="${w}" height="${h}" style="display:block">
    <polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${cur}"/>
  </svg>`;
}
function variantC() {
  const thisYear = yearTotals[3].cents, lastYear = yearTotals[2].cents;
  const dY = thisYear - lastYear;
  const thisMonth = fuelMonthCents[fuelMonthCents.length - 1];
  const fuelAvg = Math.round(fuelTotal / fuelMonthCents.length);
  const dM = thisMonth - fuelAvg;
  const lastFill = fuelMonths[17].fills.slice(-1)[0];

  const stackPalette = ['#1d4ed8', '#2563eb', '#60a5fa', '#93c5fd', '#bfdbfe', '#cbd5e1'];
  const stack = shareItems.map((it, i) => `<div style="width:${(it.actual / totalShare * 100).toFixed(2)}%;background:${stackPalette[i]}"></div>`).join('');
  const rows = shareItems.map((it, i) => `
    <div class="c-row">
      <i class="c-dot" style="background:${stackPalette[i]}"></i>
      <span>${it.name}</span>
      <span class="pct">${Math.round(it.actual / totalShare * 100)}%</span>
      ${it.save ? `<span class="c-row save green" style="font-size:10px">省${yuan(it.save)}</span>` : ''}
      <span class="amt">${yuan(it.actual)}</span>
    </div>`).join('');

  return `
  <div class="card"><div class="sec-title">保养费用走势</div>
    <div style="display:flex;align-items:flex-end;gap:8px;margin-top:8px">
      <div class="c-big">${yuan(thisYear)}</div>
      <span class="chip ${dY > 0 ? 'chip-up' : 'chip-down'}">${dY > 0 ? '+' : ''}${yuan(dY)} 较去年</span>
    </div>
    <div class="c-sub">今年保养 4 次 · 去年同期 ${yuan(lastYear)}</div>
    <div style="margin-top:8px">${sparkline(yearTotals.map(y => y.cents), 294, 44, '#1d4ed8')}</div>
    <div class="row" style="margin-top:2px">${yearTotals.map(y => `<span class="grow" style="font-size:9px;color:var(--muted);text-align:center">${y.year}</span>`).join('')}</div>
    <div class="c-insight">💡 4 年共花 ${yuan(457000)}，平均每次 ${yuan(41545)}；今年 6 月换刹车片是单笔最大（¥336）。</div>
  </div>
  <div class="card"><div class="sec-title">加油费用</div>
    <div style="display:flex;align-items:flex-end;gap:8px;margin-top:8px">
      <div class="c-big">${yuan(thisMonth)}</div>
      <span class="chip ${dM > 0 ? 'chip-up' : 'chip-down'}">本月 · ${dM > 0 ? '高于' : '低于'}月均 ${yuan(Math.abs(dM))}</span>
    </div>
    <div class="c-sub">总费用 ${yuan(fuelTotal)} · ${fuelCount} 笔 · 月均 ${yuan(fuelAvg)} · 最近一笔 9-${lastFill.day} ${yuan(lastFill.cents)}</div>
    <div style="margin-top:8px">${sparkline(fuelMonthCents, 294, 44, '#1d4ed8')}</div>
    <div class="row" style="margin-top:2px"><span class="grow" style="font-size:9px;color:var(--muted)">25.4</span><span class="grow" style="font-size:9px;color:var(--muted);text-align:center">25年10月</span><span class="grow" style="font-size:9px;color:var(--muted);text-align:right">26.9</span></div>
    <div class="c-insight">💡 近 6 个月月均 ${yuan(Math.round(fuelMonthCents.slice(-6).reduce((s, v) => s + v, 0) / 6))}，比前一年同期略高——单价与里程双涨。</div>
  </div>
  <div class="card"><div class="sec-title">项目占比</div>
    <div class="note">一条 100% 堆叠条看结构，明细紧凑排列（累计优惠 <span class="green">${yuan(totalSave)}</span>）</div>
    <div class="c-stack">${stack}</div>
    <div class="c-rows">${rows}</div>
  </div>`;
}

/* ================= 切换器 ================= */
const VARIANTS = [
  { key: 'A', name: 'A · 标准图表', desc: '坐标系柱状图 + 纵轴刻度网格线，占比为环形图 + 图例', render: variantA },
  { key: 'B', name: 'B · 日历热力', desc: '年×月热力矩阵 + 按天迷你日历，占比为矩形树图', render: variantB },
  { key: 'C', name: 'C · 大数字极简', desc: '大数字 + 涨跌 + 迷你走势线 + 一句洞察，占比为堆叠条', render: variantC },
];
function current() {
  const k = new URLSearchParams(location.search).get('variant') ?? 'A';
  return VARIANTS.find(v => v.key === k.toUpperCase()) ?? VARIANTS[0];
}
function show() {
  const v = current();
  document.getElementById('charts').innerHTML = `
    <div class="card" style="background:var(--primary-soft);padding:8px 12px;margin-top:14px">
      <span style="font-size:11px;color:var(--primary-strong);font-weight:700">${v.desc}</span>
    </div>` + v.render();
  document.getElementById('vname').textContent = v.name;
  history.replaceState(null, '', `?variant=${v.key}`);
}
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
function step(d) {
  const i = VARIANTS.indexOf(current());
  location.search = `?variant=${VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key}`;
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
show();
</script>
</body>
</html>
