org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 关闭 Flutter 插件自动写回 abiFilters 的行为（插件 apply 时会 clear 再 addAll 全部架构），
# 让 app/build.gradle.kts 里的 ndk.abiFilters 真正生效，只打包 arm64-v8a。
# 另外，target-platform 用于纯 Gradle / Android Studio 直接 assembleDebug 的场景；
# flutter build apk 命令会从命令行覆盖此值，但 abiFilters 仍会在打包阶段过滤。
disable-abi-filtering=true
target-platform=android-arm64
